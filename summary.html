<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>淡江化材系 - 國內外會議發表成果彙整表</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @media print {
        .no-print { display: none !important; }
        body { background: white !important; }
        .print-shadow-none { box-shadow: none !important; border-color: #cbd5e1 !important; }
      }
    </style>
  </head>
  <body class="bg-emerald-50/40 min-h-screen text-slate-700 antialiased selection:bg-emerald-200">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useEffect } = React;

      // 您的 Google Apps Script Web App URL
      const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzgyLPU8fthO-jmtcIUfhBtUef7JoJASZgP435rksTm0MLDh9bepESO3noXtqRE1rCBVA/exec";

      function App() {
        const [records, setRecords] = useState([]);
        const [isLoading, setIsLoading] = useState(true);
        const [isSyncing, setIsSyncing] = useState(false);
        const [searchTerm, setSearchTerm] = useState("");
        const [filterCategory, setFilterCategory] = useState("ALL");

        // 彈窗狀態：新增與編輯共用
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [editingId, setEditingId] = useState(null);
        const [formData, setFormData] = useState({
          category: "國內出差",
          name: "",
          type: "教職員工生",
          idNumber: "",
          confDate: "",
          organizer: "",
          confName: "",
          paperTitle: "",
          grantAmt: 0
        });

        // 核心：從 Google Sheets 載入資料
        const fetchSheetData = async () => {
          setIsLoading(true);
          try {
            const res = await fetch(GOOGLE_SHEET_API_URL);
            const json = await res.json();
            if (json.status === "success" && json.data) {
              setRecords(json.data);
              localStorage.setItem("TKU_CHEM_PAPERS_V3", JSON.stringify(json.data));
            }
          } catch (err) {
            console.error("無法連線 Google Sheets，嘗試載入本地暫存", err);
            const saved = localStorage.getItem("TKU_CHEM_PAPERS_V3");
            if (saved) setRecords(JSON.parse(saved));
          } finally {
            setIsLoading(false);
          }
        };

        // 第一次開啟網頁時自動抓取 Google Sheets
        useEffect(() => {
          fetchSheetData();
        }, []);

        // 同步回寫至 Google Sheets
        const syncAllToGoogleSheet = async (updatedRecords) => {
          setIsSyncing(true);
          try {
            await fetch(GOOGLE_SHEET_API_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                action: "syncAll",
                data: updatedRecords
              })
            });
            console.log("已將異動資料同步至 Google 試算表");
          } catch (e) {
            console.error("同步至 Google 試算表失敗", e);
          } finally {
            setIsSyncing(false);
          }
        };

        // 統計資訊
        const stats = useMemo(() => {
          const total = records.length;
          const domestic = records.filter(r => r.category === "國內出差").length;
          const overseas = records.filter(r => r.category === "境外出差").length;
          const totalGrant = records.reduce((sum, r) => sum + (parseFloat(r.grantAmt) || 0), 0);
          return { total, domestic, overseas, totalGrant };
        }, [records]);

        // 篩選與搜尋
        const filteredRecords = useMemo(() => {
          return records.filter((r) => {
            const matchCat = filterCategory === "ALL" || r.category === filterCategory;
            const search = searchTerm.trim().toLowerCase();
            const matchSearch =
              !search ||
              (r.name && r.name.toLowerCase().includes(search)) ||
              (r.idNumber && r.idNumber.toLowerCase().includes(search)) ||
              (r.paperTitle && r.paperTitle.toLowerCase().includes(search)) ||
              (r.confName && r.confName.toLowerCase().includes(search)) ||
              (r.organizer && r.organizer.toLowerCase().includes(search));
            return matchCat && matchSearch;
          });
        }, [records, filterCategory, searchTerm]);

        // 開啟新增彈窗
        const openCreateModal = () => {
          setEditingId(null);
          setFormData({
            category: "國內出差",
            name: "",
            type: "教職員工生",
            idNumber: "",
            confDate: "",
            organizer: "",
            confName: "",
            paperTitle: "",
            grantAmt: 0
          });
          setIsModalOpen(true);
        };

        // 開啟編輯彈窗
        const openEditModal = (item) => {
          setEditingId(item.id);
          setFormData({
            category: item.category || "國內出差",
            name: item.name || "",
            type: item.type || "教職員工生",
            idNumber: item.idNumber || "",
            confDate: item.confDate || "",
            organizer: item.organizer || "",
            confName: item.confName || "",
            paperTitle: item.paperTitle || "",
            grantAmt: item.grantAmt || 0
          });
          setIsModalOpen(true);
        };

        // 儲存表單 (新增 或 修改)
        const handleSubmitForm = (e) => {
          e.preventDefault();
          if (!formData.name.trim() || !formData.paperTitle.trim()) {
            return alert("請填寫發表人姓名與發表論文題目！🌿");
          }

          let newRecords = [];
          if (editingId !== null) {
            newRecords = records.map(r => r.id === editingId ? { ...r, ...formData, grantAmt: parseFloat(formData.grantAmt) || 0 } : r);
          } else {
            const newEntry = {
              id: "item_" + Date.now(),
              timestamp: new Date().toLocaleString("zh-TW", { timeZone: "Asia/Taipei" }),
              ...formData,
              grantAmt: parseFloat(formData.grantAmt) || 0
            };
            newRecords = [newEntry, ...records];
          }

          setRecords(newRecords);
          localStorage.setItem("TKU_CHEM_PAPERS_V3", JSON.stringify(newRecords));
          setIsModalOpen(false);

          // 同步儲存至 Google 試算表
          syncAllToGoogleSheet(newRecords);
        };

        // 刪除紀錄
        const handleDeleteRecord = (id) => {
          if (confirm("確定要刪除這筆發表成果紀錄嗎？此動作將同步至雲端試算表。")) {
            const newRecords = records.filter(r => r.id !== id);
            setRecords(newRecords);
            localStorage.setItem("TKU_CHEM_PAPERS_V3", JSON.stringify(newRecords));
            syncAllToGoogleSheet(newRecords);
          }
        };

        // 匯出 CSV (Excel 相容)
        const exportCSV = () => {
          if (filteredRecords.length === 0) return alert("目前無資料可供匯出！");
          const headers = ["類別", "姓名", "身分類別", "學號/人員代號", "會議日期", "主辦單位", "研討會/會議名稱", "發表論文題目", "募款補助金額(NT$)"];
          const rows = filteredRecords.map(r => [
            `"${r.category}"`,
            `"${r.name}"`,
            `"${r.type}"`,
            `"\t${r.idNumber}"`,
            `"${r.confDate || ''}"`,
            `"${(r.organizer || '').replace(/"/g, '""')}"`,
            `"${(r.confName || '').replace(/"/g, '""')}"`,
            `"${(r.paperTitle || '').replace(/"/g, '""')}"`,
            `"${r.grantAmt || 0}"`
          ]);

          const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
          const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.setAttribute("download", `化材系_會議發表成果彙整表_${new Date().toISOString().slice(0, 10)}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        return (
          <div className="max-w-7xl mx-auto p-4 md:p-8 my-6 md:my-10">
            {/* 頂部切換三頁籤 */}
            <div className="flex justify-center gap-3 mb-6 no-print flex-wrap">
              <a
                href="index.html"
                className="bg-white/80 hover:bg-white text-slate-500 font-black px-6 py-2.5 rounded-2xl border border-emerald-100 shadow-sm transition flex items-center gap-2 cursor-pointer"
              >
                <span>🇹🇼</span> 國內出差報帳
              </a>
              <a
                href="overseas.html"
                className="bg-white/80 hover:bg-white text-slate-500 font-black px-6 py-2.5 rounded-2xl border border-emerald-100 shadow-sm transition flex items-center gap-2 cursor-pointer"
              >
                <span>✈️</span> 境外出差報帳
              </a>
              <span className="bg-emerald-600 text-white font-black px-6 py-2.5 rounded-2xl shadow-md flex items-center gap-2 ring-2 ring-emerald-300">
                <span>📚</span> 會議發表成果彙整
              </span>
            </div>

            {/* 標題卡片 */}
            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl shadow-emerald-900/5 border-2 border-emerald-200/80 mb-8 relative overflow-hidden text-center print-shadow-none">
              <div className="absolute top-4 right-4 flex items-center gap-2 no-print">
                <button
                  type="button"
                  onClick={fetchSheetData}
                  className="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-1.5 rounded-full transition border border-emerald-200 flex items-center gap-1 cursor-pointer"
                  title="從 Google 試算表拉取最新全系資料"
                >
                  <span className={isLoading ? "animate-spin" : ""}>🔄</span> 同步試算表
                </button>
                {isSyncing && (
                  <span className="text-[11px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold animate-pulse">
                    正在寫入雲端...
                  </span>
                )}
              </div>

              <div className="inline-flex items-center gap-2 bg-emerald-100 text-emerald-800 text-xs font-black px-4 py-1.5 rounded-full mb-3 tracking-wider">
                <span>🌟 淡江大學 化學工程與材料工程學系</span>
              </div>
              <h1 className="text-2xl md:text-4xl font-black text-slate-800 tracking-tight">
                國內外會議發表成果彙整表
              </h1>
              <p className="text-slate-400 text-xs mt-2 font-medium no-print">
                雙向連動 Google 試算表・支援成果自建修改、募款補助金額登記與 Excel 一鍵匯出
              </p>
            </div>

            {/* 統計儀表板 */}
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-8 no-print">
              <div className="bg-white rounded-2xl p-5 border-2 border-emerald-100 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-black text-slate-400">總發表篇數</p>
                  <p className="text-3xl font-black text-emerald-700 font-mono mt-1">{stats.total}</p>
                </div>
                <div className="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl font-black">
                  📝
                </div>
              </div>

              <div className="bg-white rounded-2xl p-5 border-2 border-teal-100 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-black text-slate-400">國內學術年會</p>
                  <p className="text-3xl font-black text-teal-600 font-mono mt-1">{stats.domestic}</p>
                </div>
                <div className="w-12 h-12 rounded-2xl bg-teal-100 text-teal-700 flex items-center justify-center text-2xl font-black">
                  🇹🇼
                </div>
              </div>

              <div className="bg-white rounded-2xl p-5 border-2 border-cyan-100 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-black text-slate-400">境外國際會議</p>
                  <p className="text-3xl font-black text-cyan-700 font-mono mt-1">{stats.overseas}</p>
                </div>
                <div className="w-12 h-12 rounded-2xl bg-cyan-100 text-cyan-700 flex items-center justify-center text-2xl font-black">
                  ✈️
                </div>
              </div>

              <div className="bg-white rounded-2xl p-5 border-2 border-amber-200 bg-amber-50/30 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-black text-amber-800">募款補助總額</p>
                  <p className="text-2xl font-black text-amber-600 font-mono mt-1">
                    NT$ {stats.totalGrant.toLocaleString()}
                  </p>
                </div>
                <div className="w-12 h-12 rounded-2xl bg-amber-100 text-amber-800 flex items-center justify-center text-2xl font-black">
                  💰
                </div>
              </div>
            </div>

            {/* 工具列 */}
            <div className="bg-white rounded-2xl p-4 md:p-5 shadow-sm border border-emerald-100 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between no-print">
              <div className="flex flex-wrap gap-2 items-center w-full md:w-auto">
                <button
                  onClick={() => setFilterCategory("ALL")}
                  className={`px-4 py-2 rounded-xl text-xs font-black transition cursor-pointer ${
                    filterCategory === "ALL"
                      ? "bg-emerald-800 text-white shadow"
                      : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                  }`}
                >
                  全部 ({records.length})
                </button>
                <button
                  onClick={() => setFilterCategory("國內出差")}
                  className={`px-4 py-2 rounded-xl text-xs font-black transition cursor-pointer ${
                    filterCategory === "國內出差"
                      ? "bg-teal-600 text-white shadow"
                      : "bg-teal-50 text-teal-700 hover:bg-teal-100"
                  }`}
                >
                  🇹🇼 國內研討會 ({stats.domestic})
                </button>
                <button
                  onClick={() => setFilterCategory("境外出差")}
                  className={`px-4 py-2 rounded-xl text-xs font-black transition cursor-pointer ${
                    filterCategory === "境外出差"
                      ? "bg-cyan-700 text-white shadow"
                      : "bg-cyan-50 text-cyan-800 hover:bg-cyan-100"
                  }`}
                >
                  ✈️ 境外國際會議 ({stats.overseas})
                </button>
              </div>

              <div className="flex flex-wrap gap-2 w-full md:w-auto">
                <input
                  type="text"
                  placeholder="搜尋發表人、學號、題目、會議..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="px-4 py-2 rounded-xl border border-slate-200 text-sm focus:border-emerald-400 outline-none w-full md:w-60"
                />
                <button
                  onClick={openCreateModal}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-black shadow transition whitespace-nowrap flex items-center gap-1 cursor-pointer"
                >
                  <span>➕ 手動登記成果</span>
                </button>
                <button
                  onClick={exportCSV}
                  className="bg-teal-700 hover:bg-teal-800 text-white px-4 py-2 rounded-xl text-xs font-black shadow transition whitespace-nowrap flex items-center gap-1 cursor-pointer"
                  title="匯出 Excel 相容 CSV"
                >
                  <span>📊 匯出 Excel</span>
                </button>
                <button
                  onClick={() => window.print()}
                  className="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-black shadow transition whitespace-nowrap flex items-center gap-1 cursor-pointer"
                >
                  <span>🖨️ 列印</span>
                </button>
              </div>
            </div>

            {/* 資料清單表格 */}
            <div className="bg-white rounded-3xl overflow-hidden shadow-xl shadow-emerald-900/5 border-2 border-emerald-100 print-shadow-none">
              <div className="overflow-x-auto">
                <table className="w-full text-sm text-left">
                  <thead>
                    <tr className="bg-emerald-100/60 text-emerald-950 font-black text-xs border-b border-emerald-200">
                      <th className="p-4 w-12 text-center">#</th>
                      <th className="p-4 w-28 text-center">類別</th>
                      <th className="p-4 w-36">發表人資訊</th>
                      <th className="p-4">發表論文題目</th>
                      <th className="p-4">研討會 / 會議全名 與 主辦單位</th>
                      <th className="p-4 w-28 text-center">會議日期</th>
                      <th className="p-4 w-32 text-right">募款補助金額</th>
                      <th className="p-4 w-28 text-center no-print">操作</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {isLoading ? (
                      <tr>
                        <td colSpan="8" className="p-12 text-center text-emerald-700 font-bold">
                          <span className="inline-block animate-spin mr-2">🔄</span>
                          正在連線 Google 試算表讀取全系發表成果...
                        </td>
                      </tr>
                    ) : filteredRecords.length === 0 ? (
                      <tr>
                        <td colSpan="8" className="p-10 text-center text-slate-400 font-medium">
                          目前 Google 試算表中尚無發表成果資料 🍃
                        </td>
                      </tr>
                    ) : (
                      filteredRecords.map((r, idx) => (
                        <tr key={r.id || idx} className="hover:bg-emerald-50/40 transition">
                          <td className="p-4 text-center font-mono font-bold text-slate-400 text-xs">
                            {idx + 1}
                          </td>
                          <td className="p-4 text-center">
                            <span
                              className={`text-[11px] font-black px-2.5 py-1 rounded-full ${
                                r.category === "境外出差"
                                  ? "bg-cyan-100 text-cyan-800 border border-cyan-200"
                                  : "bg-teal-100 text-teal-800 border border-teal-200"
                              }`}
                            >
                              {r.category === "境外出差" ? "✈️ 境外" : "🇹🇼 國內"}
                            </span>
                          </td>
                          <td className="p-4">
                            <div className="font-black text-slate-800">{r.name}</div>
                            <div className="text-xs text-slate-400 font-mono">
                              {r.idNumber ? r.idNumber : "—"}
                            </div>
                            <div className="text-[10px] text-emerald-700/80 font-medium">{r.type}</div>
                          </td>
                          <td className="p-4">
                            <div className="font-bold text-slate-800 leading-snug">
                              {r.paperTitle || "—"}
                            </div>
                          </td>
                          <td className="p-4">
                            <div className="font-bold text-slate-700">{r.confName || "—"}</div>
                            <div className="text-xs text-slate-400 mt-0.5">
                              {r.organizer ? `主辦：${r.organizer}` : ""}
                            </div>
                          </td>
                          <td className="p-4 text-center font-mono text-xs text-slate-600 whitespace-nowrap">
                            {r.confDate || "—"}
                          </td>
                          <td className="p-4 text-right font-mono font-bold text-amber-700 whitespace-nowrap">
                            {r.grantAmt > 0 ? `NT$ ${parseFloat(r.grantAmt).toLocaleString()}` : <span className="text-slate-300 font-normal">NT$ 0</span>}
                          </td>
                          <td className="p-4 text-center no-print">
                            <div className="flex items-center justify-center gap-2">
                              <button
                                onClick={() => openEditModal(r)}
                                className="text-slate-400 hover:text-emerald-600 transition p-1 cursor-pointer"
                                title="修改"
                              >
                                ✏️
                              </button>
                              <button
                                onClick={() => handleDeleteRecord(r.id)}
                                className="text-slate-400 hover:text-rose-500 transition p-1 cursor-pointer"
                                title="刪除"
                              >
                                🗑️
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {/* 新增 / 修改 彈窗表單 */}
            {isModalOpen && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl border border-emerald-200 max-h-[90vh] overflow-y-auto">
                  <div className="flex justify-between items-center mb-5 pb-3 border-b border-slate-100">
                    <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">
                      <span>{editingId !== null ? "✏️ 修改發表成果" : "➕ 登記發表成果"}</span>
                    </h3>
                    <button
                      onClick={() => setIsModalOpen(false)}
                      className="text-slate-400 hover:text-slate-600 text-xl font-bold cursor-pointer"
                    >
                      ✕
                    </button>
                  </div>

                  <form onSubmit={handleSubmitForm} className="space-y-4">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-black text-slate-500 mb-1 block">出差類別</label>
                        <select
                          className="w-full border p-2.5 rounded-xl text-sm outline-none focus:border-emerald-400 bg-emerald-50/20"
                          value={formData.category}
                          onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        >
                          <option value="國內出差">🇹🇼 國內出差</option>
                          <option value="境外出差">✈️ 境外出差</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-black text-slate-500 mb-1 block">身分類別</label>
                        <select
                          className="w-full border p-2.5 rounded-xl text-sm outline-none focus:border-emerald-400 bg-emerald-50/20"
                          value={formData.type}
                          onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                        >
                          <option>教職員工生</option>
                          <option>校外專家</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-black text-slate-500 mb-1 block">發表人姓名 *</label>
                        <input
                          required
                          placeholder="例如: 王小明"
                          className="w-full border p-2.5 rounded-xl text-sm outline-none focus:border-emerald-400 bg-emerald-50/20"
                          value={formData.name}
                          onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        />
                      </div>
                      <div>
                        <label className="text-xs font-black text-slate-500 mb-1 block">學號 / 人員代號</label>
                        <input
                          placeholder="例如: 410410001"
                          className="w-full border p-2.5 rounded-xl text-sm outline-none focus:border-emerald-400 bg-emerald-50/20 font-mono"
                          value={formData.idNumber}
                          onChange={(e) => setFormData({ ...formData, idNumber: e.target.value })}
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-xs font-black text-slate-500 mb-1 block">發表論文題目 *</label>
                      <input
                        required
                        placeholder="請輸入論文完整題目"
                        className="w-full border p-2.5 rounded-xl text-sm outline-none focus:border-emerald-400 bg-emerald-50/20"
                        value={formData.paperTitle}
                        onChange={(e) => setFormData({ ...formData, paperTitle: e.target.value })}
                      />
                    </div>

                    <div>
                      <label className="text-xs font-black text-slate-500 mb-1 block">研討會 / 會議全名</label>
                      <input
                        placeholder="例如: 2026 化工年會"
                        className="w-full border p-2.5 rounded-xl text-sm outline-none focus:border-emerald-400 bg-emerald-50/20"
                        value={formData.confName}
                        onChange={(e) => setFormData({ ...formData, confName: e.target.value })}
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-black text-slate-500 mb-1 block">主辦單位</label>
                        <input
                          placeholder="例如: 台灣化學工程學會"
                          className="w-full border p-2.5 rounded-xl text-sm outline-none focus:border-emerald-400 bg-emerald-50/20"
                          value={formData.organizer}
                          onChange={(e) => setFormData({ ...formData, organizer: e.target.value })}
                        />
                      </div>
                      <div>
                        <label className="text-xs font-black text-slate-500 mb-1 block">會議日期</label>
                        <input
                          placeholder="例如: 11/20 - 11/22"
                          className="w-full border p-2.5 rounded-xl text-sm outline-none focus:border-emerald-400 bg-emerald-50/20 font-mono"
                          value={formData.confDate}
                          onChange={(e) => setFormData({ ...formData, confDate: e.target.value })}
                        />
                      </div>
                    </div>

                    <div className="bg-amber-50/60 p-4 rounded-2xl border border-amber-200">
                      <label className="text-xs font-black text-amber-900 mb-1 block flex items-center gap-1">
                        <span>💰 募款補助金額 (NT$)</span>
                      </label>
                      <input
                        type="number"
                        min="0"
                        placeholder="0"
                        className="w-full border p-2.5 rounded-xl text-sm outline-none focus:border-amber-400 bg-white font-mono font-bold text-amber-800"
                        value={formData.grantAmt}
                        onChange={(e) => setFormData({ ...formData, grantAmt: e.target.value })}
                      />
                      <p className="text-[11px] text-amber-700/70 mt-1">若此項成果有申請系上募款專案經費補助，請輸入核定金額。</p>
                    </div>

                    <div className="flex justify-end gap-3 pt-3">
                      <button
                        type="button"
                        onClick={() => setIsModalOpen(false)}
                        className="px-5 py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100 transition cursor-pointer"
                      >
                        取消
                      </button>
                      <button
                        type="submit"
                        className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-xs font-black shadow transition cursor-pointer"
                      >
                        {editingId !== null ? "儲存修改" : "確認登記"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            <div className="mt-8 text-center no-print">
              <span className="text-xs text-slate-400 font-medium">
                淡江大學 化學工程與材料工程學系 © 2026 會議發表成果管理
              </span>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
