<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>淡江化材系 - 國內外會議發表成果彙整表</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @media print {
        .no-print { display: none !important; }
        body { background: white !important; }
        .print-shadow-none { box-shadow: none !important; border-color: #cbd5e1 !important; }
      }
    </style>
  </head>
  <body class="bg-emerald-50/40 min-h-screen text-slate-700 antialiased selection:bg-emerald-200">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useEffect } = React;

      // ⚠️ 請填入您的 Google Apps Script Web App 網址
      const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbx7e8CwJg48lkZBIFjEUA3rxuNXwr9Ujfj8daNOrZFBuQO_PMKY9knokvgUoPdaEh7SrA/exec";

      function App() {
        const [records, setRecords] = useState([]);
        const [isLoading, setIsLoading] = useState(true);
        const [searchTerm, setSearchTerm] = useState("");
        const [filterCategory, setFilterCategory] = useState("ALL"); // ALL, 國內出差, 境外出差

        // 從 Google 試算表讀取最新全系資料
        const fetchSheetData = async () => {
          setIsLoading(true);
          try {
            if (GOOGLE_SHEET_API_URL.includes("YOUR_SCRIPT_ID_HERE")) {
              // 若尚未設定網址，載入本地預設範例
              setRecords([
                {
                  id: 1,
                  category: "境外出差",
                  name: "王小明 (範例)",
                  type: "教職員工生",
                  idNumber: "410410001",
                  confDate: "07/15 - 07/19",
                  organizer: "American Chemical Society",
                  confName: "ACS Fall 2026 National Meeting & Expo",
                  paperTitle: "Highly Efficient Photocatalysts for Hydrogen Evolution Reaction"
                },
                {
                  id: 2,
                  category: "國內出差",
                  name: "李佩佩 (範例)",
                  type: "教職員工生",
                  idNumber: "411410022",
                  confDate: "11/20 - 11/21",
                  organizer: "台灣化學工程學會",
                  confName: "2026 台灣化工年會暨專題研討會",
                  paperTitle: "聚合物薄膜於二氧化碳捕獲之分離效能研究"
                }
              ]);
              setIsLoading(false);
              return;
            }

            const res = await fetch(GOOGLE_SHEET_API_URL);
            const json = await res.json();
            if (json.status === "success") {
              setRecords(json.data);
            }
          } catch (err) {
            console.error("無法取得 Google 試算表資料", err);
            alert("讀取雲端試算表失敗，請確認網路連線或 Apps Script 權限！");
          } finally {
            setIsLoading(false);
          }
        };

        useEffect(() => {
          fetchSheetData();
        }, []);

        // 統計篇數
        const stats = useMemo(() => {
          const total = records.length;
          const domestic = records.filter(r => r.category === "國內出差").length;
          const overseas = records.filter(r => r.category === "境外出差").length;
          return { total, domestic, overseas };
        }, [records]);

        // 篩選與搜尋
        const filteredRecords = useMemo(() => {
          return records.filter((r) => {
            const matchCat = filterCategory === "ALL" || r.category === filterCategory;
            const search = searchTerm.trim().toLowerCase();
            const matchSearch =
              !search ||
              (r.name && r.name.toLowerCase().includes(search)) ||
              (r.idNumber && r.idNumber.toLowerCase().includes(search)) ||
              (r.paperTitle && r.paperTitle.toLowerCase().includes(search)) ||
              (r.confName && r.confName.toLowerCase().includes(search)) ||
              (r.organizer && r.organizer.toLowerCase().includes(search));
            return matchCat && matchSearch;
          });
        }, [records, filterCategory, searchTerm]);

        // 匯出 Excel 相容 CSV
        const exportCSV = () => {
          if (filteredRecords.length === 0) return alert("目前無資料可供匯出！");
          const headers = ["類別", "姓名", "身分類別", "學號/人員代號", "會議日期", "主辦單位", "研討會/會議名稱", "發表論文題目"];
          const rows = filteredRecords.map(r => [
            `"${r.category}"`,
            `"${r.name}"`,
            `"${r.type}"`,
            `"\t${r.idNumber}"`,
            `"${r.confDate || ''}"`,
            `"${(r.organizer || '').replace(/"/g, '""')}"`,
            `"${(r.confName || '').replace(/"/g, '""')}"`,
            `"${(r.paperTitle || '').replace(/"/g, '""')}"`
          ]);

          const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
          const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.setAttribute("download", `化材系_會議發表成果彙整表_${new Date().toISOString().slice(0, 10)}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        return (
          <div className="max-w-7xl mx-auto p-4 md:p-8 my-6 md:my-10">
            {/* 頂部切換三頁籤 */}
            <div className="flex justify-center gap-3 mb-6 no-print flex-wrap">
              <a
                href="index.html"
                className="bg-white/80 hover:bg-white text-slate-500 font-black px-6 py-2.5 rounded-2xl border border-emerald-100 shadow-sm transition flex items-center gap-2 cursor-pointer"
              >
                <span>🇹🇼</span> 國內出差報帳
              </a>
              <a
                href="overseas.html"
                className="bg-white/80 hover:bg-white text-slate-500 font-black px-6 py-2.5 rounded-2xl border border-emerald-100 shadow-sm transition flex items-center gap-2 cursor-pointer"
              >
                <span>✈️</span> 境外出差報帳
              </a>
              <span className="bg-emerald-600 text-white font-black px-6 py-2.5 rounded-2xl shadow-md flex items-center gap-2 ring-2 ring-emerald-300">
                <span>📚</span> 會議發表成果彙整
              </span>
            </div>

            {/* 標題卡片 */}
            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl shadow-emerald-900/5 border-2 border-emerald-200/80 mb-8 relative overflow-hidden text-center print-shadow-none">
              <div className="absolute top-4 right-4 flex items-center gap-2 no-print">
                <button
                  type="button"
                  onClick={fetchSheetData}
                  className="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-1.5 rounded-full transition border border-emerald-200 flex items-center gap-1 cursor-pointer"
                  title="從 Google 試算表同步最新資料"
                >
                  <span className={isLoading ? "animate-spin" : ""}>🔄</span> 即時重新整理
                </button>
              </div>

              <div className="inline-flex items-center gap-2 bg-emerald-100 text-emerald-800 text-xs font-black px-4 py-1.5 rounded-full mb-3 tracking-wider">
                <span>🌟 淡江大學 化學工程與材料工程學系</span>
              </div>
              <h1 className="text-2xl md:text-4xl font-black text-slate-800 tracking-tight">
                國內外會議發表成果彙整表
              </h1>
              <p className="text-slate-400 text-xs mt-2 font-medium no-print">
                雲端連動 Google 試算表・即時彙整師生發表於國內外學術年會與研討會論文
              </p>
            </div>

            {/* 統計儀表板 */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8 no-print">
              <div className="bg-white rounded-2xl p-5 border-2 border-emerald-100 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-black text-slate-400">總發表篇數</p>
                  <p className="text-3xl font-black text-emerald-700 font-mono mt-1">{stats.total}</p>
                </div>
                <div className="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl font-black">
                  📝
                </div>
              </div>
              <div className="bg-white rounded-2xl p-5 border-2 border-teal-100 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-black text-slate-400">國內學術年會 / 研討會</p>
                  <p className="text-3xl font-black text-teal-600 font-mono mt-1">{stats.domestic}</p>
                </div>
                <div className="w-12 h-12 rounded-2xl bg-teal-100 text-teal-700 flex items-center justify-center text-2xl font-black">
                  🇹🇼
                </div>
              </div>
              <div className="bg-white rounded-2xl p-5 border-2 border-cyan-100 shadow-sm flex items-center justify-between">
                <div>
                  <p className="text-xs font-black text-slate-400">境外國際學術會議</p>
                  <p className="text-3xl font-black text-cyan-700 font-mono mt-1">{stats.overseas}</p>
                </div>
                <div className="w-12 h-12 rounded-2xl bg-cyan-100 text-cyan-700 flex items-center justify-center text-2xl font-black">
                  ✈️
                </div>
              </div>
            </div>

            {/* 工具列：搜尋、篩選與匯出按鈕 */}
            <div className="bg-white rounded-2xl p-4 md:p-5 shadow-sm border border-emerald-100 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between no-print">
              <div className="flex flex-wrap gap-2 items-center w-full md:w-auto">
                <button
                  onClick={() => setFilterCategory("ALL")}
                  className={`px-4 py-2 rounded-xl text-xs font-black transition cursor-pointer ${
                    filterCategory === "ALL"
                      ? "bg-emerald-800 text-white shadow"
                      : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                  }`}
                >
                  全部 ({records.length})
                </button>
                <button
                  onClick={() => setFilterCategory("國內出差")}
                  className={`px-4 py-2 rounded-xl text-xs font-black transition cursor-pointer ${
                    filterCategory === "國內出差"
                      ? "bg-teal-600 text-white shadow"
                      : "bg-teal-50 text-teal-700 hover:bg-teal-100"
                  }`}
                >
                  🇹🇼 國內研討會 ({stats.domestic})
                </button>
                <button
                  onClick={() => setFilterCategory("境外出差")}
                  className={`px-4 py-2 rounded-xl text-xs font-black transition cursor-pointer ${
                    filterCategory === "境外出差"
                      ? "bg-cyan-700 text-white shadow"
                      : "bg-cyan-50 text-cyan-800 hover:bg-cyan-100"
                  }`}
                >
                  ✈️ 境外國際會議 ({stats.overseas})
                </button>
              </div>

              <div className="flex gap-2 w-full md:w-auto">
                <input
                  type="text"
                  placeholder="搜尋發表人、學號、題目、會議..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="px-4 py-2 rounded-xl border border-slate-200 text-sm focus:border-emerald-400 outline-none w-full md:w-64"
                />
                <button
                  onClick={exportCSV}
                  className="bg-teal-700 hover:bg-teal-800 text-white px-4 py-2 rounded-xl text-xs font-black shadow transition whitespace-nowrap flex items-center gap-1 cursor-pointer"
                  title="匯出 Excel 相容 CSV"
                >
                  <span>📊 匯出 Excel</span>
                </button>
                <button
                  onClick={() => window.print()}
                  className="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-black shadow transition whitespace-nowrap flex items-center gap-1 cursor-pointer"
                >
                  <span>🖨️ 列印</span>
                </button>
              </div>
            </div>

            {/* 資料成果清單表格 */}
            <div className="bg-white rounded-3xl overflow-hidden shadow-xl shadow-emerald-900/5 border-2 border-emerald-100 print-shadow-none">
              <div className="overflow-x-auto">
                <table className="w-full text-sm text-left">
                  <thead>
                    <tr className="bg-emerald-100/60 text-emerald-950 font-black text-xs border-b border-emerald-200">
                      <th className="p-4 w-12 text-center">#</th>
                      <th className="p-4 w-28 text-center">類別</th>
                      <th className="p-4 w-36">發表人資訊</th>
                      <th className="p-4">發表論文題目</th>
                      <th className="p-4">研討會 / 會議全名 與 主辦單位</th>
                      <th className="p-4 w-32 text-center">會議日期</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {isLoading ? (
                      <tr>
                        <td colSpan="6" className="p-12 text-center text-emerald-700 font-bold">
                          <span className="inline-block animate-spin mr-2">🔄</span>
                          正在連線 Google 試算表同步全系發表成果...
                        </td>
                      </tr>
                    ) : filteredRecords.length === 0 ? (
                      <tr>
                        <td colSpan="6" className="p-10 text-center text-slate-400 font-medium">
                          目前試算表中尚無發表成果資料 🍃
                        </td>
                      </tr>
                    ) : (
                      filteredRecords.map((r, idx) => (
                        <tr key={idx} className="hover:bg-emerald-50/40 transition">
                          <td className="p-4 text-center font-mono font-bold text-slate-400 text-xs">
                            {idx + 1}
                          </td>
                          <td className="p-4 text-center">
                            <span
                              className={`text-[11px] font-black px-2.5 py-1 rounded-full ${
                                r.category === "境外出差"
                                  ? "bg-cyan-100 text-cyan-800 border border-cyan-200"
                                  : "bg-teal-100 text-teal-800 border border-teal-200"
                              }`}
                            >
                              {r.category === "境外出差" ? "✈️ 境外" : "🇹🇼 國內"}
                            </span>
                          </td>
                          <td className="p-4">
                            <div className="font-black text-slate-800">{r.name}</div>
                            <div className="text-xs text-slate-400 font-mono">
                              {r.idNumber ? r.idNumber : "—"}
                            </div>
                            <div className="text-[10px] text-emerald-700/80 font-medium">{r.type}</div>
                          </td>
                          <td className="p-4">
                            <div className="font-bold text-slate-800 leading-snug">
                              {r.paperTitle || "—"}
                            </div>
                          </td>
                          <td className="p-4">
                            <div className="font-bold text-slate-700">{r.confName || "—"}</div>
                            <div className="text-xs text-slate-400 mt-0.5">
                              {r.organizer ? `主辦：${r.organizer}` : ""}
                            </div>
                          </td>
                          <td className="p-4 text-center font-mono text-xs text-slate-600 whitespace-nowrap">
                            {r.confDate || "—"}
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {/* 頁尾提示 */}
            <div className="mt-8 text-center no-print">
              <span className="text-xs text-slate-400 font-medium">
                淡江大學 化學工程與材料工程學系 © 2026 會議發表成果雲端庫
              </span>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
