<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>化材系境外出差報帳 (2026/10版 by Pei)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.49.1/build/docxtemplater.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  </head>
  <body class="bg-sky-50/50 min-h-screen text-slate-700 antialiased selection:bg-sky-200">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo } = React;

      function App() {
        const [formData, setFormData] = useState({
          unit: "化學工程與材料工程學系",
          name: "",
          type: "教職員工生",
          reason: "",
          startYear: "2026",
          startMonth: "",
          startDay: "",
          endYear: "2026",
          endMonth: "",
          endDay: "",
          totalDays: 1, // 出差總天數
          receiptCount: 0,
          dailyPerDiem: 0,   // 每日日支額 (外幣)
          perDiemRate: 32.5, // 適用匯率 (出國前一日台銀現金賣出美元)
          trip: {
            location: "",
            confName: "",      // 會議名稱
            organizer: "",     // 主辦單位
            paperTitle: "",    // 發表論文題目
            confStartM: "",    // 會議開始月
            confStartD: "",    // 會議開始日
            confEndM: "",      // 會議結束月
            confEndD: "",      // 會議結束日
            workSummary: "",   // 工作記要
            plane: 0,          // 飛機機票費 (NT$)
          },
        });

        // 取得有效出差天數
        const currentTotalDays = parseInt(formData.totalDays) || 1;

        // 計算生活費總計 (外幣標準 × 匯率 × 出差總天數)
        const livingTotalTWD = useMemo(() => {
          const perDiem = parseFloat(formData.dailyPerDiem) || 0;
          const rate = parseFloat(formData.perDiemRate) || 0;
          return Math.round(perDiem * rate * currentTotalDays);
        }, [formData.dailyPerDiem, formData.perDiemRate, currentTotalDays]);

        // 機票金額 (NT$)
        const planeTotalTWD = parseFloat(formData.trip.plane) || 0;

        // 整份報告總計 (生活費總計 + 機票)
        const grandTotal = useMemo(() => {
          return livingTotalTWD + planeTotalTWD;
        }, [livingTotalTWD, planeTotalTWD]);

        // 更新行程欄位
        const updateTripField = (field, value) => {
          setFormData({
            ...formData,
            trip: { ...formData.trip, [field]: value },
          });
        };

        // 產出 Word 檔
        const generateOverseasDoc = async () => {
          if (!formData.name) return alert("請輸入姓名後再產生文件！🌸");

          try {
            const response = await fetch("./public/overseas_travel_template.docx");
            if (!response.ok) throw new Error("找不到海外報帳範本 (overseas_travel_template.docx)");

            const content = await response.arrayBuffer();
            const zip = new window.PizZip(content);
            const doc = new window.docxtemplater(zip, {
              paragraphLoop: true,
              linebreaks: true,
            });

            // 會議起訖字串整理
            const confPeriodStr = (formData.trip.confStartM && formData.trip.confStartD)
              ? `${formData.trip.confStartM}/${formData.trip.confStartD} - ${formData.trip.confEndM}/${formData.trip.confEndD}`
              : "";

            // 準備填入 Word 的資料物件
            const overseasData = {
              name: formData.name,
              type: formData.type,
              reason: formData.reason,
              start_year: formData.startYear,
              start_m: formData.startMonth,
              start_d: formData.startDay,
              end_year: formData.endYear,
              end_m: formData.endMonth,
              end_d: formData.endDay,
              total_days: currentTotalDays,
              receipt_count: formData.receiptCount || 0,
              rate: formData.perDiemRate || "", // 填入 Word 左側「（匯率 : {rate}）」
              daily_per_diem: formData.dailyPerDiem || "",
              living_total: livingTotalTWD,
              plane_total: planeTotalTWD,
              grand_total: grandTotal,
              // 會議與論文變數
              conf_name: formData.trip.confName || "",
              organizer: formData.trip.organizer || "",
              paper_title: formData.trip.paperTitle || "",
              conf_start_m: formData.trip.confStartM || "",
              conf_start_d: formData.trip.confStartD || "",
              conf_end_m: formData.trip.confEndM || "",
              conf_end_d: formData.trip.confEndD || "",
              conf_period: confPeriodStr,
              // 行程明細欄位
              d1_loc: formData.trip.location || "",
              d1_work: formData.trip.workSummary || "",
              d1_plane: planeTotalTWD > 0 ? planeTotalTWD : "",
              d1_per_diem: formData.dailyPerDiem > 0 ? formData.dailyPerDiem : "",
            };

            doc.render(overseasData);

            const out = doc.getZip().generate({
              type: "blob",
              mimeType:
                "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            });

            saveAs(out, `淡江化材_國外出差申報單_${formData.name || "未命名"}.docx`);
          } catch (e) {
            console.error(e);
            alert(`[產檔錯誤]: ${e.message}\n請確認 public 資料夾是否存在 overseas_travel_template.docx。`);
          }
        };

        return (
          <div className="max-w-6xl mx-auto p-4 md:p-8 my-6 md:my-10">
            {/* 頂部切換分頁標籤 (Tab) */}
            <div className="flex justify-center gap-3 mb-6">
              <a
                href="index.html"
                className="bg-white/80 hover:bg-white text-slate-500 font-black px-6 py-2.5 rounded-2xl border border-sky-100 shadow-sm transition flex items-center gap-2 cursor-pointer"
              >
                <span>🇹🇼</span> 國內出差報帳
              </a>
              <span className="bg-sky-500 text-white font-black px-6 py-2.5 rounded-2xl shadow-md flex items-center gap-2 ring-2 ring-sky-300">
                <span>✈️</span> 境外出差報帳 (新制)
              </span>
            </div>

            {/* 標題卡片 */}
            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl shadow-sky-900/5 border-2 border-sky-200/80 mb-8 relative text-center">
              <div className="inline-flex items-center gap-2 bg-sky-100 text-sky-800 text-xs font-black px-4 py-1.5 rounded-full mb-3 tracking-wider">
                <span>🌐 淡江大學 化學工程與材料工程學系</span>
              </div>
              <h1 className="text-2xl md:text-4xl font-black text-slate-800 tracking-tight flex items-center justify-center gap-3">
                <span>國外出差旅費申報小幫手</span>
                <span className="text-sm bg-sky-600 text-white font-bold px-3 py-1 rounded-2xl shadow-sm rotate-2">
                  115新制
                </span>
              </h1>
              <p className="text-slate-400 text-xs mt-2 font-medium">
                專為飛機票與生活費日支額設計・外幣標準 × 匯率 × 出差總天數・一鍵套印正式申報單
              </p>
            </div>

            {/* 基本資料卡片 */}
            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl shadow-sky-900/5 border-2 border-sky-100 mb-8">
              <div className="flex items-center gap-2 font-black text-sky-700 text-base mb-5 pb-3 border-b border-sky-100">
                <span className="text-xl">📋</span> 基本資料與出差期間
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-5 mb-5">
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-2 ml-1">
                    姓名 <span className="text-rose-500">*</span>
                  </label>
                  <input
                    className="border-2 border-slate-100 bg-sky-50/20 p-3 rounded-2xl focus:border-sky-400 focus:bg-white outline-none transition font-medium"
                    placeholder="請輸入姓名"
                    value={formData.name}
                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  />
                </div>
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-2 ml-1">身分類別</label>
                  <select
                    className="w-full border-2 border-slate-100 bg-sky-50/20 p-3 rounded-2xl focus:border-sky-400 outline-none transition font-medium"
                    value={formData.type}
                    onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                  >
                    <option>教職員工生</option>
                    <option>校外專家</option>
                  </select>
                </div>
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-2 ml-1">出差事由</label>
                  <input
                    className="border-2 border-slate-100 bg-sky-50/20 p-3 rounded-2xl focus:border-sky-400 focus:bg-white outline-none transition font-medium"
                    placeholder="例如: 赴美參加國際材料年會發表"
                    value={formData.reason}
                    onChange={(e) => setFormData({ ...formData, reason: e.target.value })}
                  />
                </div>
              </div>

              {/* 出差起訖日期、出差總天數與單據張數 */}
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4 bg-sky-50/40 p-5 rounded-2xl border border-sky-100 items-end">
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">出差啟程日期 (西元)</label>
                  <div className="flex gap-1 items-center">
                    <input
                      className="w-16 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="YYYY"
                      value={formData.startYear}
                      onChange={(e) => setFormData({ ...formData, startYear: e.target.value })}
                    />
                    <span>/</span>
                    <input
                      className="w-12 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="M"
                      value={formData.startMonth}
                      onChange={(e) => setFormData({ ...formData, startMonth: e.target.value })}
                    />
                    <span>/</span>
                    <input
                      className="w-12 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="D"
                      value={formData.startDay}
                      onChange={(e) => setFormData({ ...formData, startDay: e.target.value })}
                    />
                  </div>
                </div>

                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">出差結束日期 (西元)</label>
                  <div className="flex gap-1 items-center">
                    <input
                      className="w-16 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="YYYY"
                      value={formData.endYear}
                      onChange={(e) => setFormData({ ...formData, endYear: e.target.value })}
                    />
                    <span>/</span>
                    <input
                      className="w-12 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="M"
                      value={formData.endMonth}
                      onChange={(e) => setFormData({ ...formData, endMonth: e.target.value })}
                    />
                    <span>/</span>
                    <input
                      className="w-12 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="D"
                      value={formData.endDay}
                      onChange={(e) => setFormData({ ...formData, endDay: e.target.value })}
                    />
                  </div>
                </div>

                {/* 出差總天數 */}
                <div className="flex flex-col">
                  <label className="text-xs font-black text-sky-800 mb-1.5 ml-1 flex items-center gap-1">
                    <span>🗓️ 出差總天數</span>
                    <span className="text-[10px] bg-sky-200 text-sky-900 px-1.5 py-0.5 rounded font-bold">乘算依據</span>
                  </label>
                  <div className="flex items-center gap-2">
                    <input
                      type="number"
                      min="1"
                      className="w-24 p-2 rounded-xl border-2 border-sky-300 text-center font-mono text-sm font-black text-sky-900 bg-white shadow-inner"
                      value={formData.totalDays}
                      onChange={(e) => setFormData({ ...formData, totalDays: e.target.value })}
                    />
                    <span className="text-xs font-bold text-slate-500">天</span>
                  </div>
                </div>

                {/* 單據張數 */}
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">檢附單據張數</label>
                  <div className="flex items-center gap-2">
                    <input
                      type="number"
                      min="0"
                      className="w-24 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm font-bold bg-white"
                      value={formData.receiptCount}
                      onChange={(e) => setFormData({ ...formData, receiptCount: e.target.value })}
                    />
                    <span className="text-xs font-bold text-slate-400">張</span>
                  </div>
                </div>
              </div>
            </div>

            {/* 國外生活費設定卡片 (日支額 × 匯率 × 總天數) */}
            <div className="bg-gradient-to-r from-sky-50 to-blue-50 rounded-3xl p-6 md:p-7 shadow-lg shadow-sky-900/5 border-2 border-sky-200 mb-8">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-sky-200/70">
                <div>
                  <h3 className="text-base font-black text-sky-950 flex items-center gap-2">
                    <span className="text-xl">🏨</span>
                    <span>國外生活費：日支額折合計算</span>
                  </h3>
                  <p className="text-xs text-sky-700/80 mt-1">
                    計算方式：每日日支額 (外幣) × 折算匯率 × 出差總天數 ({currentTotalDays} 天)
                  </p>
                </div>
                <div className="flex items-center bg-white px-5 py-2.5 rounded-2xl border-2 border-sky-300 shadow-sm">
                  <span className="text-xs font-black text-sky-900 mr-2">生活費折合新台幣合計：</span>
                  <span className="text-xl font-black text-sky-600 font-mono">
                    NT$ {livingTotalTWD.toLocaleString()}
                  </span>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-5 mt-4">
                <div className="flex flex-col">
                  <label className="text-xs font-black text-sky-900/70 mb-1.5 ml-1">
                    每日日支額標準 (外幣)
                  </label>
                  <input
                    type="number"
                    min="0"
                    className="border-2 border-sky-100 p-2.5 rounded-2xl bg-white focus:border-sky-400 outline-none text-sm font-mono font-bold text-sky-900"
                    placeholder="例如: 215"
                    value={formData.dailyPerDiem}
                    onChange={(e) => setFormData({ ...formData, dailyPerDiem: e.target.value })}
                  />
                </div>

                <div className="flex flex-col">
                  <label className="text-xs font-black text-sky-900/70 mb-1.5 ml-1">
                    適用匯率 (出國前一日台銀現金賣出美元)
                  </label>
                  <input
                    type="number"
                    step="0.01"
                    min="0"
                    className="border-2 border-sky-100 p-2.5 rounded-2xl bg-white focus:border-sky-400 outline-none text-sm font-mono font-bold text-sky-900"
                    placeholder="32.5"
                    value={formData.perDiemRate}
                    onChange={(e) => setFormData({ ...formData, perDiemRate: e.target.value })}
                  />
                </div>

                <div className="flex flex-col justify-end">
                  <div className="bg-sky-100/60 p-2.5 rounded-2xl border border-sky-200 text-xs text-sky-800 flex items-center justify-between">
                    <div>
                      <span>單日折合：</span>
                      <span className="font-mono font-bold">
                        NT$ {Math.round((parseFloat(formData.dailyPerDiem) || 0) * (parseFloat(formData.perDiemRate) || 0)).toLocaleString()}
                      </span>
                    </div>
                    <div className="font-bold text-sky-950">
                      × {currentTotalDays} 天
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* 出差行程與交通 (新增：主辦單位、發表論文題目) */}
            <div className="mb-8 bg-white rounded-3xl overflow-hidden shadow-xl shadow-sky-900/5 border-2 border-sky-100">
              <div className="bg-gradient-to-r from-sky-400 to-blue-500 px-6 py-4 flex items-center text-white">
                <span className="font-black text-base flex items-center gap-2">
                  <span className="bg-white/20 w-8 h-8 rounded-xl flex items-center justify-center text-sm font-mono">
                    ✈️
                  </span>
                  出差行程與交通
                </span>
              </div>

              <div className="p-6 space-y-5">
                {/* 第一列：起訖地點、會議名稱、主辦單位 */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  <div className="flex flex-col">
                    <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">起訖地點</label>
                    <input
                      className="w-full p-2.5 border-2 border-slate-100 rounded-2xl text-sm focus:border-sky-400 outline-none bg-sky-50/20 font-medium"
                      placeholder="例如: 台北-舊金山往返"
                      value={formData.trip.location}
                      onChange={(e) => updateTripField("location", e.target.value)}
                    />
                  </div>

                  <div className="flex flex-col">
                    <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">會議 / 研討會名稱</label>
                    <input
                      className="w-full p-2.5 border-2 border-slate-100 rounded-2xl text-sm focus:border-sky-400 outline-none bg-sky-50/20 font-medium"
                      placeholder="例如: 2026 MRS Fall Meeting"
                      value={formData.trip.confName}
                      onChange={(e) => updateTripField("confName", e.target.value)}
                    />
                  </div>

                  {/* 新增欄位 1：主辦單位 */}
                  <div className="flex flex-col">
                    <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">主辦單位</label>
                    <input
                      className="w-full p-2.5 border-2 border-slate-100 rounded-2xl text-sm focus:border-sky-400 outline-none bg-sky-50/20 font-medium"
                      placeholder="例如: Materials Research Society"
                      value={formData.trip.organizer}
                      onChange={(e) => updateTripField("organizer", e.target.value)}
                    />
                  </div>
                </div>

                {/* 第二列：會議日期、發表論文題目 */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  {/* 會議日期 */}
                  <div className="flex flex-col">
                    <label className="text-xs font-black text-sky-800 mb-1.5 ml-1 flex items-center gap-1">
                      <span>📅 會議日期 (月 / 日 - 月 / 日)</span>
                    </label>
                    <div className="flex items-center gap-1.5 bg-sky-50/30 p-2 rounded-2xl border-2 border-sky-100">
                      <div className="flex items-center gap-1 bg-white px-2 py-1 rounded-xl border border-slate-200">
                        <input
                          className="w-8 text-center text-sm font-mono outline-none"
                          placeholder="M"
                          value={formData.trip.confStartM}
                          onChange={(e) => updateTripField("confStartM", e.target.value)}
                        />
                        <span className="text-slate-300">/</span>
                        <input
                          className="w-8 text-center text-sm font-mono outline-none"
                          placeholder="D"
                          value={formData.trip.confStartD}
                          onChange={(e) => updateTripField("confStartD", e.target.value)}
                        />
                      </div>
                      <span className="text-slate-400 font-bold px-1">-</span>
                      <div className="flex items-center gap-1 bg-white px-2 py-1 rounded-xl border border-slate-200">
                        <input
                          className="w-8 text-center text-sm font-mono outline-none"
                          placeholder="M"
                          value={formData.trip.confEndM}
                          onChange={(e) => updateTripField("confEndM", e.target.value)}
                        />
                        <span className="text-slate-300">/</span>
                        <input
                          className="w-8 text-center text-sm font-mono outline-none"
                          placeholder="D"
                          value={formData.trip.confEndD}
                          onChange={(e) => updateTripField("confEndD", e.target.value)}
                        />
                      </div>
                    </div>
                  </div>

                  {/* 新增欄位 2：發表論文題目 (跨兩欄寬度) */}
                  <div className="flex flex-col md:col-span-2">
                    <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">發表論文題目</label>
                    <input
                      className="w-full p-2.5 border-2 border-slate-100 rounded-2xl text-sm focus:border-sky-400 outline-none bg-sky-50/20 font-medium"
                      placeholder="例如: Synthesis and Characterization of Novel Nanomaterials"
                      value={formData.trip.paperTitle}
                      onChange={(e) => updateTripField("paperTitle", e.target.value)}
                    />
                  </div>
                </div>

                {/* 第三列：工作記要、飛機機票 */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2 border-t border-slate-100">
                  <div className="flex flex-col">
                    <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">工作記要</label>
                    <input
                      className="w-full p-2.5 border-2 border-slate-100 rounded-2xl text-sm focus:border-sky-400 outline-none bg-sky-50/20 font-medium"
                      placeholder="例如: 大會口頭論文發表與學術座談交流"
                      value={formData.trip.workSummary}
                      onChange={(e) => updateTripField("workSummary", e.target.value)}
                    />
                  </div>

                  <div className="flex flex-col">
                    <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">飛機機票費 (實付新台幣金額)</label>
                    <div className="flex items-center bg-sky-50/40 px-3 py-2 rounded-2xl border-2 border-sky-200">
                      <span className="text-xs text-sky-800 font-black mr-2 whitespace-nowrap">✈️ NT$</span>
                      <input
                        type="number"
                        className="w-full bg-transparent outline-none text-right font-mono font-bold text-sky-900"
                        placeholder="0"
                        value={formData.trip.plane}
                        onChange={(e) => updateTripField("plane", e.target.value)}
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* 底部總覽卡片 */}
            <div className="bg-gradient-to-br from-sky-500 via-blue-600 to-indigo-600 p-8 rounded-3xl flex flex-col md:flex-row justify-between items-center shadow-xl shadow-sky-900/10 text-white">
              <div className="text-center md:text-left mb-6 md:mb-0">
                <span className="text-xs font-bold bg-white/20 px-3 py-1 rounded-full">
                  ✈️ 國外出差總支出 (機票 + 生活費)
                </span>
                <div className="flex items-baseline justify-center md:justify-start gap-1 mt-2">
                  <span className="text-2xl font-black text-sky-200">NT$</span>
                  <span className="text-5xl font-black tracking-tight font-mono">
                    {grandTotal.toLocaleString()}
                  </span>
                </div>
                <p className="text-white/80 text-xs mt-2 font-medium">
                  共計 {currentTotalDays} 日境外行程・生活費已按 {currentTotalDays} 天乘算
                </p>
              </div>

              <button
                onClick={generateOverseasDoc}
                className="bg-white text-blue-700 hover:text-blue-800 px-10 py-5 rounded-2xl font-black text-xl hover:bg-sky-50 active:scale-95 transition-all shadow-lg cursor-pointer"
              >
                產生正式國外申報單 📄
              </button>
            </div>

            {/* 核銷小提醒 (結合學校財務規範) */}
            <div className="mt-8 bg-white/70 p-5 rounded-2xl border border-sky-100 text-xs text-slate-500 space-y-1.5 shadow-sm">
              <div className="font-bold text-sky-900 flex items-center gap-1.5 text-sm mb-2">
                <span>💡</span> 境外核銷憑證貼心備忘
              </div>
              <p>• <b>機票核銷</b>：請檢附旅行業代收轉付收據、電子機票購票證明或登機證存根[cite: 6]。</p>
              <p>• <b>生活費匯率</b>：原則依出國前一天臺灣銀行現金賣出美元匯率為準，若以信用卡支付亦可檢附水單或帳單明細[cite: 6]。</p>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
