<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>化材系境外出差報帳 (2026/10版 by Pei)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.49.1/build/docxtemplater.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  </head>
  <body class="bg-sky-50/50 min-h-screen text-slate-700 antialiased selection:bg-sky-200">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo } = React;

      function App() {
        const [formData, setFormData] = useState({
          unit: "化學工程與材料工程學系",
          name: "",
          type: "教職員工生",
          reason: "",
          startYear: "2026",
          startMonth: "",
          startDay: "",
          endYear: "2026",
          endMonth: "",
          endDay: "",
          receiptCount: 0,
          days: [
            {
              id: Date.now(),
              m: "",
              d: "",
              location: "",
              workSummary: "",
              plane: 0,          // 飛機機票 (NT$)
              dailyPerDiem: 0,   // 日支額 (外幣)
              perDiemRate: 32.5, // 適用匯率
            },
          ],
        });

        // 計算單日生活費折合新台幣 (外幣標準 × 折算匯率)
        const calculatePerDiemTWD = (day) => {
          const perDiem = parseFloat(day.dailyPerDiem) || 0;
          const rate = parseFloat(day.perDiemRate) || 0;
          return Math.round(perDiem * rate);
        };

        // 計算單日折合新台幣總額 (機票 + 日支額生活費)
        const calculateDayTWD = (day) => {
          const plane = parseFloat(day.plane) || 0;
          const living = calculatePerDiemTWD(day);
          return Math.round(plane + living);
        };

        // 總計計算
        const totals = useMemo(() => {
          const grandTotal = formData.days.reduce(
            (sum, day) => sum + calculateDayTWD(day),
            0
          );
          return {
            grandTotal,
            totalDays: formData.days.length,
          };
        }, [formData.days]);

        // 更新特定日期的數值
        const updateDayField = (idx, field, value) => {
          const newDays = [...formData.days];
          newDays[idx][field] = value;
          setFormData({ ...formData, days: newDays });
        };

        // 新增一天行程
        const addDay = () => {
          setFormData({
            ...formData,
            days: [
              ...formData.days,
              {
                id: Date.now(),
                m: "",
                d: "",
                location: "",
                workSummary: "",
                plane: 0,
                dailyPerDiem: 0,
                perDiemRate: formData.days[formData.days.length - 1]?.perDiemRate || 32.5,
              },
            ],
          });
        };

        // 刪除一天行程
        const removeDay = (idx) => {
          if (formData.days.length <= 1) return;
          setFormData({
            ...formData,
            days: formData.days.filter((_, i) => i !== idx),
          });
        };

        // 產出 Word 檔
        const generateOverseasDoc = async () => {
          if (!formData.name) return alert("請輸入姓名後再產生文件！🌸");

          try {
            const response = await fetch("./public/overseas_travel_template.docx");
            if (!response.ok) throw new Error("找不到海外報帳範本 (overseas_travel_template.docx)");

            const content = await response.arrayBuffer();
            const zip = new window.PizZip(content);
            const doc = new window.docxtemplater(zip, {
              paragraphLoop: true,
              linebreaks: true,
            });

            // 基準匯率：預設取用第 1 天設定的匯率代入全域 {rate}
            const baseRate = formData.days[0]?.perDiemRate || "";

            // 整理每一天的欄位資料 (d1_*, d2_*, ...)
            const dayFields = {};
            formData.days.forEach((d, i) => {
              const p = `d${i + 1}_`;
              dayFields[`${p}m`] = d.m || "";
              dayFields[`${p}d`] = d.d || "";
              dayFields[`${p}loc`] = d.location || "";
              dayFields[`${p}work`] = d.workSummary || "";
              dayFields[`${p}plane`] = d.plane > 0 ? d.plane : "";
              dayFields[`${p}per_diem`] = d.dailyPerDiem > 0 ? d.dailyPerDiem : "";
              dayFields[`${p}rate`] = d.perDiemRate || "";
              dayFields[`${p}living_twd`] = calculatePerDiemTWD(d) > 0 ? calculatePerDiemTWD(d) : "";
              dayFields[`${p}total`] = calculateDayTWD(d);
            });

            const overseasData = {
              name: formData.name,
              type: formData.type,
              reason: formData.reason,
              start_year: formData.startYear,
              start_m: formData.startMonth,
              start_d: formData.startDay,
              end_year: formData.endYear,
              end_m: formData.endMonth,
              end_d: formData.endDay,
              total_days: totals.totalDays,
              receipt_count: formData.receiptCount || 0,
              rate: baseRate, // 填入 Word 範本左側「（匯率 : {rate}）」
              grand_total: totals.grandTotal,
              ...dayFields,
            };

            doc.render(overseasData);

            const out = doc.getZip().generate({
              type: "blob",
              mimeType:
                "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            });

            saveAs(out, `淡江化材_國外出差申報單_${formData.name || "未命名"}.docx`);
          } catch (e) {
            console.error(e);
            alert(`[產檔錯誤]: ${e.message}\n請確認 public 資料夾是否存在 overseas_travel_template.docx。`);
          }
        };

        return (
          <div className="max-w-6xl mx-auto p-4 md:p-8 my-6 md:my-10">
            {/* 頂部切換分頁標籤 (Tab) */}
            <div className="flex justify-center gap-3 mb-6">
              <a
                href="index.html"
                className="bg-white/80 hover:bg-white text-slate-500 font-black px-6 py-2.5 rounded-2xl border border-sky-100 shadow-sm transition flex items-center gap-2 cursor-pointer"
              >
                <span>🇹🇼</span> 國內出差報帳
              </a>
              <span className="bg-sky-500 text-white font-black px-6 py-2.5 rounded-2xl shadow-md flex items-center gap-2 ring-2 ring-sky-300">
                <span>✈️</span> 境外出差報帳 (新制)
              </span>
            </div>

            {/* 標題卡片 */}
            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl shadow-sky-900/5 border-2 border-sky-200/80 mb-8 relative text-center">
              <div className="inline-flex items-center gap-2 bg-sky-100 text-sky-800 text-xs font-black px-4 py-1.5 rounded-full mb-3 tracking-wider">
                <span>🌐 淡江大學 化學工程與材料工程學系</span>
              </div>
              <h1 className="text-2xl md:text-4xl font-black text-slate-800 tracking-tight flex items-center justify-center gap-3">
                <span>國外出差旅費申報小幫手</span>
                <span className="text-sm bg-sky-600 text-white font-bold px-3 py-1 rounded-2xl shadow-sm rotate-2">
                  115新制
                </span>
              </h1>
              <p className="text-slate-400 text-xs mt-2 font-medium">
                專為飛機票與日支生活費設計・即時計算外幣折合新台幣・一鍵套印正式申報單
              </p>
            </div>

            {/* 基本資料卡片 */}
            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl shadow-sky-900/5 border-2 border-sky-100 mb-8">
              <div className="flex items-center gap-2 font-black text-sky-700 text-base mb-5 pb-3 border-b border-sky-100">
                <span className="text-xl">📋</span> 基本資料與出差期間
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-5 mb-5">
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-2 ml-1">
                    姓名 <span className="text-rose-500">*</span>
                  </label>
                  <input
                    className="border-2 border-slate-100 bg-sky-50/20 p-3 rounded-2xl focus:border-sky-400 focus:bg-white outline-none transition font-medium"
                    placeholder="請輸入姓名"
                    value={formData.name}
                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                  />
                </div>
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-2 ml-1">身分類別</label>
                  <select
                    className="w-full border-2 border-slate-100 bg-sky-50/20 p-3 rounded-2xl focus:border-sky-400 outline-none transition font-medium"
                    value={formData.type}
                    onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                  >
                    <option>教職員工生</option>
                    <option>校外專家</option>
                  </select>
                </div>
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-2 ml-1">出差事由</label>
                  <input
                    className="border-2 border-slate-100 bg-sky-50/20 p-3 rounded-2xl focus:border-sky-400 focus:bg-white outline-none transition font-medium"
                    placeholder="例如: 赴美參加國際材料年會發表"
                    value={formData.reason}
                    onChange={(e) => setFormData({ ...formData, reason: e.target.value })}
                  />
                </div>
              </div>

              {/* 出差起訖日期與單據張數 */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-5 bg-sky-50/40 p-5 rounded-2xl border border-sky-100">
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">出差啟程日期 (西元)</label>
                  <div className="flex gap-1 items-center">
                    <input
                      className="w-16 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="YYYY"
                      value={formData.startYear}
                      onChange={(e) => setFormData({ ...formData, startYear: e.target.value })}
                    />
                    <span>/</span>
                    <input
                      className="w-12 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="M"
                      value={formData.startMonth}
                      onChange={(e) => setFormData({ ...formData, startMonth: e.target.value })}
                    />
                    <span>/</span>
                    <input
                      className="w-12 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="D"
                      value={formData.startDay}
                      onChange={(e) => setFormData({ ...formData, startDay: e.target.value })}
                    />
                  </div>
                </div>

                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">出差結束日期 (西元)</label>
                  <div className="flex gap-1 items-center">
                    <input
                      className="w-16 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="YYYY"
                      value={formData.endYear}
                      onChange={(e) => setFormData({ ...formData, endYear: e.target.value })}
                    />
                    <span>/</span>
                    <input
                      className="w-12 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="M"
                      value={formData.endMonth}
                      onChange={(e) => setFormData({ ...formData, endMonth: e.target.value })}
                    />
                    <span>/</span>
                    <input
                      className="w-12 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm bg-white"
                      placeholder="D"
                      value={formData.endDay}
                      onChange={(e) => setFormData({ ...formData, endDay: e.target.value })}
                    />
                  </div>
                </div>

                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-1.5 ml-1">檢附單據張數</label>
                  <div className="flex items-center gap-2">
                    <input
                      type="number"
                      min="0"
                      className="w-24 p-2 rounded-xl border border-slate-200 text-center font-mono text-sm font-bold bg-white"
                      value={formData.receiptCount}
                      onChange={(e) => setFormData({ ...formData, receiptCount: e.target.value })}
                    />
                    <span className="text-xs font-bold text-slate-400">張</span>
                  </div>
                </div>
              </div>
            </div>

            {/* 每日費用明細列表 */}
            {formData.days.map((day, idx) => (
              <div
                key={day.id}
                className="mb-8 bg-white rounded-3xl overflow-hidden shadow-xl shadow-sky-900/5 border-2 border-sky-100"
              >
                <div className="bg-gradient-to-r from-sky-400 to-blue-500 px-6 py-4 flex justify-between items-center text-white">
                  <span className="font-black text-base flex items-center gap-2">
                    <span className="bg-white/20 w-8 h-8 rounded-xl flex items-center justify-center text-sm font-mono">
                      D{idx + 1}
                    </span>
                    第 {idx + 1} 天出差明細 (當地時間)
                  </span>
                  {formData.days.length > 1 && (
                    <button
                      onClick={() => removeDay(idx)}
                      className="bg-white/20 hover:bg-rose-500 text-white px-3 py-1.5 rounded-xl text-xs font-black transition"
                    >
                      ✕ 刪除當日
                    </button>
                  )}
                </div>

                <div className="p-6 space-y-6">
                  {/* 當地時間與地點事由 */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pb-5 border-b border-slate-100">
                    <div className="flex items-center gap-2">
                      <label className="text-xs font-black text-slate-400">月/日：</label>
                      <input
                        className="w-12 p-2 border rounded-xl text-center font-mono text-sm bg-slate-50"
                        placeholder="M"
                        value={day.m}
                        onChange={(e) => updateDayField(idx, "m", e.target.value)}
                      />
                      <span>/</span>
                      <input
                        className="w-12 p-2 border rounded-xl text-center font-mono text-sm bg-slate-50"
                        placeholder="D"
                        value={day.d}
                        onChange={(e) => updateDayField(idx, "d", e.target.value)}
                      />
                    </div>
                    <div>
                      <input
                        className="w-full p-2 border rounded-xl text-sm"
                        placeholder="起訖地點 (如: 台北-舊金山)"
                        value={day.location}
                        onChange={(e) => updateDayField(idx, "location", e.target.value)}
                      />
                    </div>
                    <div>
                      <input
                        className="w-full p-2 border rounded-xl text-sm"
                        placeholder="工作記要 (如: 研討會報到/發表)"
                        value={day.workSummary}
                        onChange={(e) => updateDayField(idx, "workSummary", e.target.value)}
                      />
                    </div>
                  </div>

                  {/* 核心費用欄位：僅保留 飛機費 + 日支生活費 (含合計新台幣) */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {/* 1. 交通費 (僅飛機) */}
                    <div className="bg-sky-50/40 p-5 rounded-2xl border border-sky-100 space-y-2">
                      <div className="text-xs font-black text-sky-800 flex items-center gap-1">
                        <span>✈️</span> 交通費：飛機 (機票)
                      </div>
                      <label className="text-[11px] text-slate-400 block">機票新台幣實付金額</label>
                      <div className="flex items-center bg-white px-3 py-2 rounded-xl border border-sky-200">
                        <span className="text-xs text-slate-400 mr-1 font-bold">NT$</span>
                        <input
                          type="number"
                          className="w-full outline-none text-right font-mono font-bold text-sky-900"
                          value={day.plane}
                          onChange={(e) => updateDayField(idx, "plane", e.target.value)}
                        />
                      </div>
                    </div>

                    {/* 2. 生活費 (日支額折合 + 新台幣合計) */}
                    <div className="bg-sky-50/40 p-5 rounded-2xl border border-sky-100 space-y-2">
                      <div className="text-xs font-black text-sky-800 flex items-center justify-between">
                        <span className="flex items-center gap-1">
                          <span>🏨</span> 生活費：日支額折合
                        </span>
                      </div>
                      <label className="text-[11px] text-slate-400 block">外幣標準 × 折算匯率</label>
                      <div className="flex gap-2">
                        <div className="w-1/2 flex items-center bg-white px-3 py-2 rounded-xl border border-sky-200">
                          <input
                            type="number"
                            className="w-full outline-none text-right font-mono font-bold text-sky-900"
                            placeholder="外幣"
                            value={day.dailyPerDiem}
                            onChange={(e) => updateDayField(idx, "dailyPerDiem", e.target.value)}
                          />
                        </div>
                        <div className="w-1/2 flex items-center bg-white px-3 py-2 rounded-xl border border-sky-200">
                          <span className="text-[10px] text-slate-400 mr-1">匯率</span>
                          <input
                            type="number"
                            step="0.01"
                            className="w-full outline-none text-right font-mono font-bold text-sky-900"
                            placeholder="32.5"
                            value={day.perDiemRate}
                            onChange={(e) => updateDayField(idx, "perDiemRate", e.target.value)}
                          />
                        </div>
                      </div>

                      {/* 生活費折合新台幣合計 */}
                      <div className="flex items-center justify-between bg-sky-100/70 px-3 py-2 rounded-xl border border-sky-200 mt-2">
                        <span className="text-[11px] font-black text-sky-900">生活費折合新台幣合計</span>
                        <span className="font-mono font-black text-sky-700 text-sm">
                          NT$ {calculatePerDiemTWD(day).toLocaleString()}
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* 當日小計 */}
                  <div className="flex justify-end items-center gap-2 pt-1 text-right">
                    <span className="text-xs font-black text-slate-400">當日折合新台幣小計：</span>
                    <span className="text-xl font-black text-sky-600 font-mono">
                      NT$ {calculateDayTWD(day).toLocaleString()}
                    </span>
                  </div>
                </div>
              </div>
            ))}

            {/* 新增一日行程 */}
            <button
              onClick={addDay}
              className="w-full py-4 border-2 border-dashed border-sky-300 rounded-3xl text-sky-700 font-black hover:bg-sky-100/50 transition-all duration-300 mb-10 flex items-center justify-center gap-2 shadow-sm active:scale-[0.99]"
            >
              <span>➕ 新增下一日國外出差明細</span>
            </button>

            {/* 底部總覽卡片 */}
            <div className="bg-gradient-to-br from-sky-500 via-blue-600 to-indigo-600 p-8 rounded-3xl flex flex-col md:flex-row justify-between items-center shadow-xl shadow-sky-900/10 text-white">
              <div className="text-center md:text-left mb-6 md:mb-0">
                <span className="text-xs font-bold bg-white/20 px-3 py-1 rounded-full">
                  ✈️ 國外出差總支出 (折合新台幣)
                </span>
                <div className="flex items-baseline justify-center md:justify-start gap-1 mt-2">
                  <span className="text-2xl font-black text-sky-200">NT$</span>
                  <span className="text-5xl font-black tracking-tight font-mono">
                    {totals.grandTotal.toLocaleString()}
                  </span>
                </div>
                <p className="text-white/80 text-xs mt-2 font-medium">
                  共計 {totals.totalDays} 日境外行程・機票與日支額已折合計算
                </p>
              </div>

              <button
                onClick={generateOverseasDoc}
                className="bg-white text-blue-700 hover:text-blue-800 px-10 py-5 rounded-2xl font-black text-xl hover:bg-sky-50 active:scale-95 transition-all shadow-lg cursor-pointer"
              >
                產生正式國外申報單 📄
              </button>
            </div>

            {/* 核銷小提醒 (結合學校財務規範) */}
            <div className="mt-8 bg-white/70 p-5 rounded-2xl border border-sky-100 text-xs text-slate-500 space-y-1.5 shadow-sm">
              <div className="font-bold text-sky-900 flex items-center gap-1.5 text-sm mb-2">
                <span>💡</span> 境外核銷憑證貼心備忘
              </div>
              <p>• <b>機票核銷</b>：請檢附旅行業代收轉付收據、電子機票購票證明或登機證存根[cite: 6]。</p>
              <p>• <b>生活費匯率</b>：原則依出國前一天臺灣銀行現金賣出美元匯率為準，若以信用卡支付亦可檢附水單或帳單明細[cite: 6]。</p>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
