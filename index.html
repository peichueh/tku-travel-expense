<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>化材系國內出差報帳 (2026/10版 by Pei)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.49.1/build/docxtemplater.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  </head>
  <body class="bg-amber-50/40 min-h-screen text-slate-700 antialiased selection:bg-amber-200">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo } = React;

      function App() {
        const [formData, setFormData] = useState({
          unit: "化學工程與材料工程學系",
          name: "",
          type: "教職員工生",
          reason: "",
          regFee: 0,
          regOrganizer: "", // 主辦單位
          regConfName: "",  // 會議名稱
          items: [
            {
              id: Date.now(),
              hotel: 0,
              daily: 0,
              isHoliday: false,
              transports: [
                { m: "", d: "", startLoc: "", endLoc: "", type: "", amt: 0 },
              ],
            },
          ],
        });

        // 計算單日總計 (交通加總 + 住宿與雜費)
        const calculateItemSubtotal = (item) => {
          const transTotal = item.transports.reduce(
            (sum, t) => sum + (parseFloat(t.amt) || 0),
            0
          );
          const hotel = parseFloat(item.hotel) || 0;
          const daily = parseFloat(item.daily) || 0;

          // 住宿與雜費上限邏輯
          const hotelLimit = item.isHoliday ? 4500 : 3500;
          const finalHotel = hotel > hotelLimit ? hotelLimit : hotel;
          const finalDaily = daily > 400 ? 400 : daily;

          return transTotal + finalHotel + finalDaily;
        };

        // 計算整份報單總金額與總天數（加入註冊費）
        const totals = useMemo(() => {
          const itemsTotal = formData.items.reduce(
            (sum, item) => sum + calculateItemSubtotal(item),
            0
          );
          const regFee = parseFloat(formData.regFee) || 0;
          const grandTotal = itemsTotal + regFee;
          return { grandTotal, totalDays: formData.items.length };
        }, [formData.items, formData.regFee]);

        // 更新住宿、雜費、假日勾選
        const updateItemField = (idx, field, value) => {
          const newItems = [...formData.items];
          newItems[idx][field] = value;
          setFormData({ ...formData, items: newItems });
        };

        // 更新特定交通分段的日期、地點、車別、金額
        const updateTransportField = (itemIdx, transIdx, field, value) => {
          const newItems = [...formData.items];
          newItems[itemIdx].transports[transIdx][field] = value;
          setFormData({ ...formData, items: newItems });
        };

        // 新增交通分段 (自動帶入上一段的日期與終點)
        const addTransportSegment = (itemIdx) => {
          const newItems = [...formData.items];
          const lastSeg =
            newItems[itemIdx].transports[
              newItems[itemIdx].transports.length - 1
            ];
          newItems[itemIdx].transports.push({
            m: lastSeg.m,
            d: lastSeg.d,
            startLoc: lastSeg.endLoc,
            endLoc: "",
            type: "",
            amt: 0,
          });
          setFormData({ ...formData, items: newItems });
        };

        // 刪除交通分段
        const removeTransportSegment = (itemIdx, transIdx) => {
          if (formData.items[itemIdx].transports.length <= 1) return;
          const newItems = [...formData.items];
          newItems[itemIdx].transports = newItems[itemIdx].transports.filter(
            (_, i) => i !== transIdx
          );
          setFormData({ ...formData, items: newItems });
        };

        // 新增一日行程
        const addItem = () => {
          setFormData({
            ...formData,
            items: [
              ...formData.items,
              {
                id: Date.now(),
                hotel: 0,
                daily: 0,
                isHoliday: false,
                transports: [
                  { m: "", d: "", startLoc: "", endLoc: "", type: "", amt: 0 },
                ],
              },
            ],
          });
        };

        // 刪除一日行程
        const removeItem = (index) => {
          if (formData.items.length <= 1) return;
          setFormData({
            ...formData,
            items: formData.items.filter((_, i) => i !== index),
          });
        };

        // 核心存檔邏輯與檔案命名
        const processDoc = async (response, templateName, data) => {
          try {
            const content = await response.arrayBuffer();
            if (content.byteLength < 100) throw new Error("範本讀取不完全。");

            const zip = new window.PizZip(content);
            const doc = new window.docxtemplater(zip, {
              paragraphLoop: true,
              linebreaks: true,
            });
            doc.render(data);

            const out = doc.getZip().generate({
              type: "blob",
              mimeType:
                "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            });

            // 正式命名規則
            let fileTitle = "出差旅費報告表";
            if (templateName.includes("taxi")) {
              fileTitle = "計程車證明單";
            } else if (templateName.includes("Registration")) {
              fileTitle = "註冊費申報單";
            }

            const finalFileName = `淡江化材_${fileTitle}_${
              formData.name || "未命名"
            }.docx`;

            saveAs(out, finalFileName);
          } catch (e) {
            console.error(e);
            alert(
              `[產檔錯誤] ${templateName}: ${e.message}\n請確認範本檔案是否存在於 public 目錄。`
            );
          }
        };

        // 讀取範本檔案
        const renderDoc = async (templateName, data) => {
          try {
            const response = await fetch(`./${templateName}`);
            if (!response.ok) throw new Error(`找不到檔案: ${templateName}`);
            await processDoc(response, templateName, data);
          } catch (error) {
            alert(error.message);
          }
        };

        // 產生文件主流程
        const generateDocs = async () => {
          if (!formData.name) return alert("請輸入姓名後再產生文件！🌸");

          // 1. 產生主表資料 (國內出差旅費申報單: travel_template.docx)
          const mainData = {
            name: formData.name,
            type: formData.type,
            reason: formData.reason,
            total_amt: totals.grandTotal,
            total_days: totals.totalDays,
            items: formData.items.map((item) => ({
              display_rows: item.transports.map((t, index) => ({
                m: t.m,
                d: t.d,
                startLoc: t.startLoc,
                endLoc: t.endLoc,
                v_type: t.type,
                v_amt: t.amt,
                hotel: index === 0 ? item.hotel : "",
                daily: index === 0 ? item.daily : "",
                subtotal: index === 0 ? calculateItemSubtotal(item) : "",
              })),
            })),
          };
          await renderDoc("./public/travel_template.docx", mainData);

          // 2. 自動偵測計程車分段，並個別下載證明單 (taxi_template.docx)
          for (const item of formData.items) {
            for (const t of item.transports) {
              if (t.type.includes("計程車")) {
                const taxiData = {
                  unit: formData.unit,
                  name: formData.name,
                  reason: formData.reason,
                  m: t.m,
                  d: t.d,
                  startLoc: t.startLoc,
                  endLoc: t.endLoc,
                  v_amt: t.amt,
                };
                await renderDoc("./public/taxi_template.docx", taxiData);
              }
            }
          }

          // 3. 自動偵測是否有註冊費支出，若有則下載註冊費申報單 (Registration_template.docx)
          const regFeeAmt = parseFloat(formData.regFee) || 0;
          if (regFeeAmt > 0) {
            const registrationData = {
              type: formData.type,
              name: formData.name,
              regOrganizer: formData.regOrganizer || "",
              regConfName: formData.regConfName || "",
              regFee: regFeeAmt,
            };
            await renderDoc("./public/Registration_template.docx", registrationData);
          }
        };

        return (
          <div className="max-w-6xl mx-auto p-4 md:p-8 my-6 md:my-10">
            {/* 頂部俏皮標題卡片 */}
            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl shadow-amber-900/5 border-2 border-amber-200/80 mb-8 relative overflow-hidden text-center">
              <div className="absolute top-2 left-6 text-3xl opacity-20 select-none">✈️</div>
              <div className="absolute top-4 right-8 text-3xl opacity-20 select-none">🧳</div>
              <div className="inline-flex items-center gap-2 bg-amber-100 text-amber-800 text-xs font-black px-4 py-1.5 rounded-full mb-3 tracking-wider">
                <span>🌟 淡江大學 化學工程與材料工程學系</span>
              </div>
              <h1 className="text-2xl md:text-4xl font-black text-slate-800 tracking-tight flex items-center justify-center gap-3">
                <span>國內出差報帳小幫手</span>
                <span className="text-sm bg-rose-500 text-white font-bold px-3 py-1 rounded-2xl shadow-sm rotate-2">
                  2026/10版 @Pei
                </span>
              </h1>
              <p className="text-slate-400 text-xs mt-2 font-medium">
                輕鬆填寫出差行程・自動計算金額上限・一鍵產出正式報表
              </p>
            </div>

            {/* 基本資料卡片 */}
            <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl shadow-amber-900/5 border-2 border-amber-100 mb-8">
              <div className="flex items-center gap-2 font-black text-amber-700 text-base mb-5 pb-3 border-b border-amber-100">
                <span className="text-xl">👤</span> 出差基本資料
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-2 ml-1 flex items-center gap-1">
                    <span>姓名</span>
                    <span className="text-rose-500 text-sm">*</span>
                  </label>
                  <input
                    className="border-2 border-slate-100 bg-amber-50/20 p-3 rounded-2xl focus:border-amber-400 focus:bg-white outline-none transition font-medium"
                    placeholder="請輸入姓名"
                    value={formData.name}
                    onChange={(e) =>
                      setFormData({ ...formData, name: e.target.value })
                    }
                  />
                </div>
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-2 ml-1">
                    身分類別
                  </label>
                  <div className="relative">
                    <select
                      className="w-full border-2 border-slate-100 bg-amber-50/20 p-3 rounded-2xl focus:border-amber-400 focus:bg-white outline-none transition font-medium appearance-none cursor-pointer"
                      value={formData.type}
                      onChange={(e) =>
                        setFormData({ ...formData, type: e.target.value })
                      }
                    >
                      <option>教職員工生</option>
                      <option>校外專家</option>
                    </select>
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-xs">▼</span>
                  </div>
                </div>
                <div className="flex flex-col">
                  <label className="text-xs font-black text-slate-500 mb-2 ml-1">
                    出差事由
                  </label>
                  <input
                    className="border-2 border-slate-100 bg-amber-50/20 p-3 rounded-2xl focus:border-amber-400 focus:bg-white outline-none transition font-medium"
                    placeholder="例如: 2026 化工年會發表"
                    value={formData.reason}
                    onChange={(e) =>
                      setFormData({ ...formData, reason: e.target.value })
                    }
                  />
                </div>
              </div>
            </div>

            {/* 註冊費與會議明細卡片 (Day 1 行程清單正上方) */}
            <div className="bg-gradient-to-r from-orange-50 to-amber-50 rounded-3xl p-6 md:p-7 shadow-lg shadow-orange-900/5 border-2 border-orange-200/80 mb-8 relative">
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-4 pb-4 border-b border-orange-200/60">
                <div>
                  <h3 className="text-base font-black text-orange-950 flex items-center gap-2">
                    <span className="text-xl">🎓</span>
                    <span>學術會議 / 研討會註冊費</span>
                    <span className="bg-orange-200 text-orange-800 text-[10px] font-bold px-2 py-0.5 rounded-full">選填</span>
                  </h3>
                  <p className="text-xs text-orange-700/80 mt-1">
                    若有報名研討會並需報支註冊費請填寫，系統會自動下載專用申報單唷！
                  </p>
                </div>
                <div className="flex items-center bg-white px-4 py-2.5 rounded-2xl border-2 border-orange-200 shadow-sm w-full sm:w-auto justify-end">
                  <span className="text-orange-400 font-black mr-2 text-sm">NT$</span>
                  <input
                    type="number"
                    min="0"
                    className="w-32 outline-none text-right font-mono font-black text-orange-600 text-xl bg-transparent"
                    placeholder="0"
                    value={formData.regFee}
                    onChange={(e) =>
                      setFormData({ ...formData, regFee: e.target.value })
                    }
                  />
                </div>
              </div>

              {/* 主辦單位與會議名稱輸入區 */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="flex flex-col">
                  <label className="text-xs font-black text-orange-900/70 mb-1.5 ml-1">
                    主辦單位名稱
                  </label>
                  <input
                    className="border-2 border-orange-100 p-2.5 rounded-2xl bg-white focus:border-orange-400 outline-none text-sm transition font-medium placeholder:text-slate-300"
                    placeholder="例如: 台灣化學工程學會"
                    value={formData.regOrganizer}
                    onChange={(e) =>
                      setFormData({ ...formData, regOrganizer: e.target.value })
                    }
                  />
                </div>
                <div className="flex flex-col">
                  <label className="text-xs font-black text-orange-900/70 mb-1.5 ml-1">
                    研討會 / 會議全名
                  </label>
                  <input
                    className="border-2 border-orange-100 p-2.5 rounded-2xl bg-white focus:border-orange-400 outline-none text-sm transition font-medium placeholder:text-slate-300"
                    placeholder="例如: 2026 化工年會暨專題研討會"
                    value={formData.regConfName}
                    onChange={(e) =>
                      setFormData({ ...formData, regConfName: e.target.value })
                    }
                  />
                </div>
              </div>
            </div>

            {/* 行程列表 */}
            {formData.items.map((item, idx) => (
              <div
                key={item.id}
                className="mb-8 bg-white rounded-3xl overflow-hidden shadow-xl shadow-amber-900/5 border-2 border-amber-100 transition-all"
              >
                {/* 行程卡片 Header */}
                <div className="bg-gradient-to-r from-amber-400 via-amber-300 to-yellow-300 px-6 py-4 flex justify-between items-center text-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="bg-white/80 w-8 h-8 rounded-2xl flex items-center justify-center font-black text-amber-800 shadow-sm text-sm">
                      D{idx + 1}
                    </span>
                    <span className="font-black text-base tracking-wide">
                      第 {idx + 1} 天行程與交通
                    </span>
                  </div>
                  {formData.items.length > 1 && (
                    <button
                      onClick={() => removeItem(idx)}
                      className="bg-white/70 hover:bg-rose-500 hover:text-white text-rose-600 px-3 py-1.5 rounded-xl text-xs transition font-black flex items-center gap-1 shadow-sm"
                    >
                      <span>🗑️ 刪除此日</span>
                    </button>
                  )}
                </div>

                {/* 交通分段表格 */}
                <div className="overflow-x-auto p-2">
                  <table className="w-full text-sm text-left">
                    <thead>
                      <tr className="text-slate-400 font-black text-xs border-b border-slate-100">
                        <th className="p-3 w-28 text-center">📅 月 / 日</th>
                        <th className="p-3">🚩 起點</th>
                        <th className="p-3">🏁 迄點</th>
                        <th className="p-3">🚄 交通車別</th>
                        <th className="p-3 w-32">💵 金額</th>
                        <th className="p-3 w-10"></th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {item.transports.map((t, tIdx) => (
                        <tr
                          key={tIdx}
                          className="hover:bg-amber-50/50 transition-colors group"
                        >
                          <td className="p-3">
                            <div className="flex gap-1 justify-center items-center bg-slate-50 px-2 py-1 rounded-xl border border-slate-200/80">
                              <input
                                className="w-8 bg-transparent text-center focus:font-bold outline-none font-mono"
                                placeholder="M"
                                value={t.m}
                                onChange={(e) =>
                                  updateTransportField(
                                    idx,
                                    tIdx,
                                    "m",
                                    e.target.value
                                  )
                                }
                              />
                              <span className="text-slate-300">/</span>
                              <input
                                className="w-8 bg-transparent text-center focus:font-bold outline-none font-mono"
                                placeholder="D"
                                value={t.d}
                                onChange={(e) =>
                                  updateTransportField(
                                    idx,
                                    tIdx,
                                    "d",
                                    e.target.value
                                  )
                                }
                              />
                            </div>
                          </td>
                          <td className="p-3">
                            <input
                              className="w-full border-b border-dashed border-slate-200 focus:border-amber-400 outline-none bg-transparent p-1 font-medium transition"
                              placeholder="例如: 淡水"
                              value={t.startLoc}
                              onChange={(e) =>
                                updateTransportField(
                                  idx,
                                  tIdx,
                                  "startLoc",
                                  e.target.value
                                )
                              }
                            />
                          </td>
                          <td className="p-3">
                            <input
                              className="w-full border-b border-dashed border-slate-200 focus:border-amber-400 outline-none bg-transparent p-1 font-medium transition"
                              placeholder="例如: 台中"
                              value={t.endLoc}
                              onChange={(e) =>
                                updateTransportField(
                                  idx,
                                  tIdx,
                                  "endLoc",
                                  e.target.value
                                )
                              }
                            />
                          </td>
                          <td className="p-3">
                            <input
                              className="w-full border-b border-dashed border-slate-200 focus:border-amber-400 outline-none bg-transparent p-1 font-medium transition"
                              placeholder="高鐵 / 計程車 / 台鐵"
                              value={t.type}
                              onChange={(e) =>
                                updateTransportField(
                                  idx,
                                  tIdx,
                                  "type",
                                  e.target.value
                                )
                              }
                            />
                          </td>
                          <td className="p-3">
                            <div className="flex items-center bg-slate-50 px-2.5 py-1 rounded-xl border border-slate-200/80">
                              <span className="text-slate-400 mr-1 text-xs">$</span>
                              <input
                                className="w-full bg-transparent outline-none text-right font-mono font-black text-slate-700"
                                type="number"
                                value={t.amt}
                                onChange={(e) =>
                                  updateTransportField(
                                    idx,
                                    tIdx,
                                    "amt",
                                    e.target.value
                                  )
                                }
                              />
                            </div>
                          </td>
                          <td className="p-3 text-center">
                            {item.transports.length > 1 && (
                              <button
                                onClick={() => removeTransportSegment(idx, tIdx)}
                                className="text-slate-300 hover:text-rose-500 transition-colors font-bold text-lg leading-none"
                                title="刪除此段"
                              >
                                ✕
                              </button>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                {/* 住宿、雜費與單日小計 */}
                <div className="p-5 bg-amber-50/30 border-t border-amber-100 flex flex-col md:flex-row gap-5 items-center justify-between">
                  <button
                    onClick={() => addTransportSegment(idx)}
                    className="flex items-center gap-1.5 bg-white text-amber-800 border-2 border-amber-200 hover:border-amber-300 hover:bg-amber-100 px-4 py-2 rounded-2xl text-xs font-black shadow-sm transition active:scale-95"
                  >
                    <span>➕ 增加同日接續交通</span>
                  </button>

                  <div className="flex flex-wrap gap-4 items-center bg-white px-5 py-3 rounded-2xl shadow-sm border border-amber-100">
                    <label className="text-xs font-black text-slate-500 flex items-center">
                      <span className="mr-1.5">🏨 住宿費</span>
                      <input
                        className="w-20 border-b-2 border-amber-200 ml-1 p-1 text-right font-mono font-bold text-amber-700 outline-none focus:border-amber-500"
                        type="number"
                        value={item.hotel}
                        onChange={(e) =>
                          updateItemField(idx, "hotel", e.target.value)
                        }
                      />
                    </label>

                    <label className="text-xs font-black text-slate-600 flex items-center cursor-pointer select-none bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-xl border border-amber-200 transition">
                      <input
                        className="mr-2 w-4 h-4 rounded-lg accent-amber-500 cursor-pointer"
                        type="checkbox"
                        checked={item.isHoliday}
                        onChange={(e) =>
                          updateItemField(idx, "isHoliday", e.target.checked)
                        }
                      />
                      <span>假日上限 $4,500</span>
                    </label>

                    <label className="text-xs font-black text-slate-500 flex items-center">
                      <span className="mr-1.5">☕ 雜費</span>
                      <input
                        className="w-16 border-b-2 border-amber-200 ml-1 p-1 text-right font-mono font-bold text-amber-700 outline-none focus:border-amber-500"
                        type="number"
                        value={item.daily}
                        onChange={(e) =>
                          updateItemField(idx, "daily", e.target.value)
                        }
                      />
                    </label>
                  </div>

                  <div className="text-right">
                    <span className="text-xs font-black text-slate-400 block mb-0.5">DAY 小計</span>
                    <span className="text-2xl font-black text-amber-600 font-mono">
                      ${calculateItemSubtotal(item)}
                    </span>
                  </div>
                </div>
              </div>
            ))}

            {/* 新增一日按鈕 */}
            <button
              onClick={addItem}
              className="w-full py-4 border-2 border-dashed border-amber-300 rounded-3xl text-amber-700 font-black hover:bg-amber-100/50 hover:border-amber-400 transition-all duration-300 mb-10 flex items-center justify-center gap-2 shadow-sm group active:scale-[0.99]"
            >
              <span className="text-xl group-hover:rotate-90 transition-transform">➕</span>
              <span>新增下一天出差行程</span>
            </button>

            {/* 底部總覽卡片 */}
            <div className="bg-gradient-to-br from-amber-400 via-orange-400 to-rose-400 p-8 rounded-3xl flex flex-col md:flex-row justify-between items-center shadow-xl shadow-orange-900/10 text-white relative overflow-hidden">
              <div className="relative z-10 text-center md:text-left mb-6 md:mb-0">
                <div className="inline-flex items-center gap-1.5 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold tracking-wider mb-2">
                  <span>✨ 總支出試算 (含註冊費)</span>
                </div>
                <div className="flex items-baseline justify-center md:justify-start gap-1">
                  <span className="text-2xl font-black text-amber-100">NT$</span>
                  <span className="text-5xl md:text-6xl font-black tracking-tight font-mono drop-shadow-sm">
                    {totals.grandTotal}
                  </span>
                </div>
                <p className="text-white/80 text-xs mt-2 font-medium">
                  目前已為您規劃累計 {totals.totalDays} 日的出差行程明細
                </p>
              </div>

              <button
                onClick={generateDocs}
                className="relative z-10 bg-white text-orange-600 hover:text-orange-700 px-10 py-5 rounded-2xl font-black text-xl hover:bg-amber-50 active:scale-95 transition-all shadow-lg hover:shadow-xl flex items-center gap-2 group cursor-pointer"
              >
                <span>產生正式 Word 報表</span>
                <span className="group-hover:translate-x-1 transition-transform">📄</span>
              </button>
            </div>

            {/* 底部貼心提示 */}
            <div className="mt-8 text-center">
              <div className="inline-flex items-center gap-2 bg-white/80 px-5 py-2.5 rounded-full border border-amber-200/80 text-amber-800 text-xs font-medium shadow-sm">
                <span>💡</span>
                <span>
                  貼心小提示：交通若填寫「計程車」或有填寫「註冊費」，系統會自動同時下載專用表格喔！
                </span>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
